name: "Publish Python distribution to PyPI"
# Uses:
# https://github.com/actions/checkout : v7.0.1 de0fac2e4500dabe0009e67214ff5f5447ce83dd
# https://github.com/actions/download-artifact : v8.0.2 9000827ccba6bdab643e8b6fd33ac0654aef8333
# https://github.com/actions/upload-artifact : v7.0.2 cf430e030ddbb5b0abf93d22962f4752f3646cd9
# https://github.com/astral-sh/setup-uv : v10.3.2 07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
# https://github.com/pypa/gh-action-pypi-publish : v1.14.3 7245906fb61fa33a13554f9d5fb856fe61758086

on:
  release:
    types: [published]

jobs:
  build:
    name: "Build package"
    runs-on: "ubuntu-latest"
    outputs:
      artifact-id: "${{ steps.upload-artifact.outputs.artifact-id }}"

    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false

      - name: "Install the latest version of uv"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"
        with:
          version: "latest"
          enable-cache: true

      - name: "Build the package"
        run: "uvx nox --session build"

      - name: "Store the distribution packages"
        id: "upload-artifact"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          path: "./dist"

  publish-to-pypi:
    name: "Publish Python Distribution to PyPI"
    needs: ["build"]
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/project/commented-configparser/"
    permissions:
      id-token: "write"

    steps:
      - name: "Download all the dists"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   "
        with:
          artifact-ids: "${{ needs.build.outputs.artifact-id }}"
          path: "./dist"
          merge-multiple: true

      - name: "Publish distribution to PyPI"
        uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086"
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          verbose: true
